name: Fern checks
on:
  push:
    branches: [main, feat/pgn-review-foundation]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: test -s dist/engine/stockfish-19-lite-single.js
      - run: test -s dist/engine/stockfish-19-lite-single.wasm
