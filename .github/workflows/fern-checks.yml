name: Fern checks
on:
  push:
    branches: [feat/pgn-review-foundation, main]
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate FEN fixtures and move legality
        run: node tests/validate-positions.mjs
      - name: Unit and interpretation benchmarks
        run: npm test
      - name: Production build
        run: npm run build
      - name: Run Stockfish depth benchmark
        run: |
          STOCKFISH_BIN=$(find node_modules/stockfish -type f -name 'stockfish-*-single' | head -1)
          if [ -z "$STOCKFISH_BIN" ]; then echo 'Native Stockfish binary not bundled; benchmark deferred.'; exit 0; fi
          chmod +x "$STOCKFISH_BIN"
          STOCKFISH_BIN="$STOCKFISH_BIN" node tests/stockfish-bench.mjs
